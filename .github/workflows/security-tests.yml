name: Security Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    name: Python security tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      # The OPA adapter shells out to `opa eval` and fails closed without it,
      # so the authorization tests need the CLI on PATH.
      - name: Install pinned OPA CLI (checksum verified)
        env:
          OPA_VERSION: "1.21.1"
        run: |
          base="https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          curl -fsSL -o opa "$base"
          curl -fsSL -o opa.sha256 "$base.sha256"
          echo "$(cut -d' ' -f1 opa.sha256)  opa" | sha256sum -c -
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  rego-tests:
    name: OPA policy tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Rego tests with OPA
        run: |
          docker run --rm \
            -v "$PWD/policy:/policy:ro" \
            openpolicyagent/opa:1.21.1-static \
            test /policy -v
